name: all_tools_app
description: "A production-quality offline-first All Tools Flutter app featuring ~200 interactive tools."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Local Persistence
  shared_preferences: ^2.3.3

  # Typography & Localization
  google_fonts: ^6.2.1
  intl: ^0.19.0

  # Utilities
  qr_flutter: ^4.1.0
  math_expressions: ^2.5.0
  crypto: ^3.0.3
  uuid: ^4.4.0
  image_picker: ^1.1.2
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/font/
    - assets/logo/

  fonts:
    - family: hind
      fonts:
        - asset: assets/font/hind.ttf
